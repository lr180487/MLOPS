[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "practica-mlops"
version = "2.1.0"
description = "Aplicación web MLOps para predicción agroclimática y monitoreo"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Uso académico" }
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "scikit-learn==1.6.1",
  "joblib>=1.4,<2.0",
  "matplotlib>=3.8,<4.0",
  "seaborn>=0.13,<1.0",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "pydantic>=2.6,<3.0",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.1,<4.0",
  "httpx>=0.27,<1.0",
  "openpyxl>=3.1,<4.0",
  "reportlab>=4.0,<5.0",
  "statsmodels>=0.14,<1.0",
  "gradio>=4.0,<6.0",
  "plotly>=5.18,<7.0",
  "requests>=2.31,<3.0",
  "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "ipykernel>=6.29,<7.0",
  "jupyter>=1.0,<2.0",
  "nbconvert>=7.16,<8.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist", "output", "storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["api"]

[tool.coverage.report]
show_missing = true
skip_covered = true
